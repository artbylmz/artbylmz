name: Recent Stars

on:
  schedule: [{cron: "33 6 * * *"}]
  workflow_dispatch:

jobs:
  recent-stars:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update README with recent stars
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/recent-stars.py
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README recent stars - [Skip GitHub Action]"
          git push
